# Serves the built SPA and proxies the API, reproducing what `vite.config.ts` does for the
# dev server so one bundle works in both places.

upstream base_project_api {
    server api:8000;
}

# The access log records the PATH, never the query string or the Referer. The emailed links
# open `/reset-password?token=…` and `/verify-account?token=…`, and the token in them is a
# live one-time credential; nginx's default format logs `$request` (the full line, query
# included) and `$http_referer` — which, under this file's `strict-origin-when-cross-origin`
# policy, is the full URL of that page on every same-origin request it makes afterwards. So
# the default format wrote the token to stdout up to a dozen times per link opened. Otherwise
# the same fields as nginx's stock `main` format. The path comes from `$request_uri` with the
# query cut off, not from `$uri`: `$uri` is the path *after* try_files, so every SPA route
# would be logged as /index.html.
#
# The limit of this: nginx's *error* log has no configurable format, and a failed upstream
# (a 502 while the API is down) prints the full request line there. The SPA never puts a
# token in an /api URL — it posts it in the body — so only a hand-made request to
# `GET /api/user/verify-token?token=…` during an outage can reach it.
map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
}

log_format base_project '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $request_path $server_protocol" $status $body_bytes_sent '
                        '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log base_project;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------- security headers ---
    #
    # This file is the entire serving path — the Dockerfile copies it to
    # /etc/nginx/conf.d/default.conf and docker-compose publishes the container directly,
    # with no TLS terminator or other proxy in front. So headers that are absent here are
    # absent everywhere; there was previously no CSP, no X-Frame-Options, nothing.
    #
    # frame-ancestors 'none' (and X-Frame-Options for older browsers) is the one that was
    # actively exploitable: an attacker page could iframe the app and UI-redress clicks onto
    # a destructive action such as deleting a user. The ConfirmDialog makes it two clicks,
    # which a framed overlay chains.
    #
    # A HASH-based CSP, not a nonce: nginx serves a static bundle with no per-request
    # server to mint one, and the app has exactly one inline script (the pre-paint theme
    # block in index.html). `scripts/csp-hash.mjs` runs as postbuild and FAILS THE BUILD if
    # the built HTML's hash is not in the script-src below — a stale hash makes the browser
    # silently refuse the theme script, and the symptom is a flash of the wrong theme
    # rather than anything that looks like a CSP problem.
    #
    # Two directives are deliberately looser than they look:
    #   style-src 'unsafe-inline' — sonner and react-style-singleton (which Radix's
    #     react-remove-scroll uses for every Dialog/Sheet/Select) both inject <style>
    #     elements at runtime with no nonce, and motion writes inline style attributes.
    #     script-src is the half that matters; this is the accepted trade.
    #   fonts.googleapis.com / fonts.gstatic.com — index.html loads Inter from the Google
    #     Fonts CDN. Self-host it and both allowances can be deleted.
    #
    # connect-src 'self' is sufficient because every request goes through
    # src/api/client.ts against a same-origin /api. `worker-src 'self'` is kept even though
    # nothing spawns a worker today: it costs nothing and removing it would silently widen
    # to default-src rather than forbid workers.
    #
    # Strict-Transport-Security is deliberately ABSENT: this stack is plain HTTP, and HSTS
    # on an HTTP origin is either ignored or actively harmful. Add it when TLS terminates
    # in front of this container.
    #
    # `always` so the headers are still sent on error responses (a 404 from try_files is
    # still a document an attacker could frame).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-wfp7Nv+2U+SJtktXNuq8SEX3z9iSX0JgzfJpnPnNnM8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src 'self' blob:; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    # The API. The trailing slash on proxy_pass is what strips the `/api` prefix — the same
    # rewrite `vite.config.ts` applies, and the reason `/api/user/login` reaches `/user/login`.
    # Getting this wrong is silent: every call 404s with a perfectly healthy backend.
    location /api/ {
        proxy_pass http://base_project_api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Every call is a short JSON request answered from the API's own database (plus one
        # SMTP hand-off on the flows that send an email), so the default 60s
        # proxy_read_timeout is ample and is left in place; `src/api/client.ts` gives up
        # well before it. Requests are small JSON bodies and nothing is uploaded,
        # so the default 1m client_max_body_size is left in place rather than raised.
    }

    # A backstop. nginx's bundled mime.types maps `js` and `wasm` but has no entry for
    # `mjs`, so an .mjs asset goes out as application/octet-stream. Browsers enforce the
    # MIME type on ES module scripts and refuse to execute that, which surfaces in the app
    # as "Failed to fetch dynamically imported module" — the file is there and returns 200
    # the whole time, only its Content-Type is wrong, which is why it looks like a missing
    # asset. Vite's dev server types it correctly, so this fails only in Docker.
    #
    # This build emits no .mjs at all today, and `scripts/check-asset-extensions.mjs` fails
    # the build if one appears. The rule stays because it costs nothing and it covers the
    # window between a dependency starting to emit one and anyone noticing: fixing it here
    # alone would not be enough anyway, since asset URLs are content-hashed and served
    # `immutable` below, so a browser that cached the mis-typed response keeps it under a
    # URL no server-side change can alter.
    #
    # `default_type`, not a `types { }` block: types is replaced wholesale rather than
    # merged when redefined at a lower level, so a types block here would drop the mapping
    # for every .js and .css beside it. default_type applies only when the extension is
    # unknown to the inherited map, which is exactly this case.
    #
    # A regex location wins over the /assets/ prefix below, so the caching headers are
    # repeated here rather than inherited.
    location ~ \.mjs$ {
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx's add_header inheritance is replace-not-merge: a location that defines ANY
        # add_header stops inheriting the server-level ones entirely. These three locations
        # each set Cache-Control, so the security headers must be repeated here or they
        # silently vanish from exactly the responses that matter most.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-YqxCA7bptPAmpXZn0DKI4nGSQ9M6qjYQDZrUu2JZeWs='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
        try_files $uri =404;
    }

    # Hashed assets are immutable — the filename changes when the content does.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx's add_header inheritance is replace-not-merge: a location that defines ANY
        # add_header stops inheriting the server-level ones entirely. These three locations
        # each set Cache-Control, so the security headers must be repeated here or they
        # silently vanish from exactly the responses that matter most.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-YqxCA7bptPAmpXZn0DKI4nGSQ9M6qjYQDZrUu2JZeWs='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
        try_files $uri =404;
    }

    # Client-side routing: every unknown path is a React Router route, not a 404. index.html
    # itself must never be cached, or a deploy leaves browsers pointed at deleted bundles.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # nginx's add_header inheritance is replace-not-merge: a location that defines ANY
        # add_header stops inheriting the server-level ones entirely. These three locations
        # each set Cache-Control, so the security headers must be repeated here or they
        # silently vanish from exactly the responses that matter most.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-YqxCA7bptPAmpXZn0DKI4nGSQ9M6qjYQDZrUu2JZeWs='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    }

    gzip on;
    # text/javascript also covers the .mjs backstop location above.
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
